name: Frontend

on:
  pull_request:
    branches: [main, develop, 'codex/**']
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.6.2
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, types, format and 100% coverage
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Catalog build
        run: npm run catalog:build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Production browser smoke tests
        run: npm run test:e2e
      - name: Catalog browser tests
        run: npm run test:catalog
      - name: Upload coverage and browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-quality-reports
          path: |
            apps/frontend/coverage/
            apps/frontend/playwright-report/
            apps/frontend/test-results/
            apps/frontend/catalog-report/
            apps/frontend/catalog-results/
          retention-days: 14
      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/frontend/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload catalog artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-catalog
          path: apps/frontend/storybook-static/
          if-no-files-found: error
          retention-days: 14
